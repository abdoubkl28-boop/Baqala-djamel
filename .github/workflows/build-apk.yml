name: Build Baqala Djamel APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android WebView project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/baqala/djamel
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BaqalaDjamel"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.baqala.djamel"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.baqala.djamel"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 2
                  versionName = "1.1"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:label="بقالة جمال"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:hardwareAccelerated="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#16865B</item>
                  <item name="android:statusBarColor">#F7F8FA</item>
                  <item name="android:navigationBarColor">#F7F8FA</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/baqala/djamel/MainActivity.kt <<'EOF'
          package com.baqala.djamel

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.View
          import android.webkit.ConsoleMessage
          import android.webkit.PermissionRequest
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceError
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.TextView
          import android.widget.Button
          import android.widget.LinearLayout

          class MainActivity : Activity() {
              private lateinit var webView: WebView
              private var pendingCameraRequest: PermissionRequest? = null
              private val appUrl = "https://abdoubkl28-boop.github.io/Baqala-djamel/"
              private val appHost = "abdoubkl28-boop.github.io"
              private val cameraRequestCode = 501

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.rgb(247, 248, 250)
                  window.navigationBarColor = Color.rgb(247, 248, 250)
                  if (android.os.Build.VERSION.SDK_INT >= 23) {
                      window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR
                  }

                  webView = WebView(this)
                  webView.setBackgroundColor(Color.rgb(247, 248, 250))
                  setContentView(webView)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      allowFileAccess = false
                      allowContentAccess = false
                      javaScriptCanOpenWindowsAutomatically = false
                      setSupportMultipleWindows(false)
                      loadsImagesAutomatically = true
                      mediaPlaybackRequiresUserGesture = false
                      useWideViewPort = true
                      loadWithOverviewMode = true
                  }

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onPermissionRequest(request: PermissionRequest) {
                          runOnUiThread {
                              val wantsVideo = request.resources.contains(
                                  PermissionRequest.RESOURCE_VIDEO_CAPTURE
                              )
                              if (!wantsVideo) {
                                  request.deny()
                              } else if (checkSelfPermission(android.Manifest.permission.CAMERA) ==
                                  PackageManager.PERMISSION_GRANTED) {
                                  request.grant(arrayOf(PermissionRequest.RESOURCE_VIDEO_CAPTURE))
                              } else {
                                  pendingCameraRequest = request
                                  requestPermissions(
                                      arrayOf(android.Manifest.permission.CAMERA),
                                      cameraRequestCode
                                  )
                              }
                          }
                      }

                      override fun onPermissionRequestCanceled(request: PermissionRequest) {
                          if (pendingCameraRequest == request) pendingCameraRequest = null
                      }

                      override fun onConsoleMessage(message: ConsoleMessage): Boolean {
                          android.util.Log.d(
                              "BaqalaWebView",
                              "${message.message()} -- line ${message.lineNumber()}"
                          )
                          return true
                      }
                  }

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(
                          view: WebView?,
                          request: WebResourceRequest?
                      ): Boolean {
                          val uri: Uri = request?.url ?: return false
                          if (uri.scheme == "https" && uri.host == appHost) return false
                          if (uri.scheme == "http" || uri.scheme == "https") {
                              startActivity(Intent(Intent.ACTION_VIEW, uri))
                              return true
                          }
                          return true
                      }

                      override fun onReceivedError(
                          view: WebView,
                          request: WebResourceRequest,
                          error: WebResourceError
                      ) {
                          super.onReceivedError(view, request, error)
                          if (request.isForMainFrame) showLoadError(error.description.toString())
                      }
                  }

                  // Always load the live page on launch; do not restore a stale blank WebView state.
                  webView.loadUrl(appUrl)
              }

              private fun showLoadError(details: String) {
                  val safeDetails = details.replace("<", "&lt;").replace(">", "&gt;")
                  val html = """
                      <html><meta name="viewport" content="width=device-width, initial-scale=1">
                      <body style="font-family:sans-serif;background:#f7f8fa;color:#222;text-align:center;padding:40px 20px;direction:rtl">
                      <h3>تعذر تحميل تطبيق بقالة جمال</h3>
                      <p>تحقق من اتصال الإنترنت ثم حاول مرة أخرى.</p>
                      <p style="font-size:12px;color:#777">$safeDetails</p>
                      <button onclick="location.href='$appUrl'" style="padding:12px 24px;background:#16865b;color:white;border:0;border-radius:8px">إعادة المحاولة</button>
                      </body></html>
                  """.trimIndent()
                  webView.loadDataWithBaseURL(appUrl, html, "text/html", "UTF-8", null)
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == cameraRequestCode) {
                      val request = pendingCameraRequest
                      pendingCameraRequest = null
                      if (request != null) {
                          if (grantResults.isNotEmpty() &&
                              grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                              request.grant(arrayOf(PermissionRequest.RESOURCE_VIDEO_CAPTURE))
                          } else {
                              request.deny()
                          }
                      }
                  }
              }

              override fun onBackPressed() {
                  if (::webView.isInitialized && webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }

              override fun onDestroy() {
                  pendingCameraRequest?.deny()
                  pendingCameraRequest = null
                  if (::webView.isInitialized) {
                      webView.stopLoading()
                      webView.destroy()
                  }
                  super.onDestroy()
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baqala-djamel-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
